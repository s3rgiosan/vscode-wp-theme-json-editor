name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
