name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: npx vsce package

      - name: Pack shared UI package
        run: |
          set -euo pipefail
          # The package ships with the extension's version.
          npm version "${GITHUB_REF_NAME}" -w @s3rgiosan/theme-json-editor-ui \
            --no-git-tag-version --allow-same-version
          # `npm pack` writes the default `<scope>-<name>-<version>.tgz`
          # filename. Rename it to track the extension's tag so plugins
          # can pin against a stable URL.
          npm pack -w @s3rgiosan/theme-json-editor-ui --pack-destination=.
          mv s3rgiosan-theme-json-editor-ui-*.tgz "theme-json-editor-ui-${GITHUB_REF_NAME}.tgz"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.vsix
            theme-json-editor-ui-*.tgz

      - name: Notify WP plugin
        run: |
          gh api repos/s3rgiosan/wp-theme-json-editor/dispatches \
            -f event_type=theme-json-editor-ui-release \
            -f "client_payload[version]=${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
